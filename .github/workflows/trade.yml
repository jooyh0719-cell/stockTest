name: Toss Infinite Buying Bot Trade

on:
  schedule:
    # 서머타임(3월~11월): UTC 13:30 (한국시간 밤 10:30)
    # 평시(11월~3월): UTC 14:30 (한국시간 밤 11:30)
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # 수동 실행(Run workflow) 버튼 활성화

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run trading script
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ: ${{ secrets.TOSS_ACCOUNT_SEQ }}
          FIXIE_URL: ${{ secrets.FIXIE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
