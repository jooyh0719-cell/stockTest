name: Toss Infinite Buying Bot

on:
  schedule:
    # 월~금 (UTC 14:00~20:00 / KST 23:00~05:00) 매 30분마다 자동 실행
    - cron: '*/30 14-20 * * 1-5'
  workflow_dispatch: # Actions 탭에서 [Run workflow] 수동 실행 버튼을 활성화합니다.

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run trading script
      env:
        TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
        TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
      run: python main.py

