name: Toss Infinite Buying Bot Trade

on:
  schedule:
    # 한국 주식: 한국시간 09:05
    # - cron: '5 0 * * 1-5'

    # 미국 주식: 서머타임, 한국시간 22:35
    # - cron: '35 13 * * 1-5'

    # 미국 주식: 표준시간, 한국시간 23:35
    - cron: '35 14 * * 1-5'

  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run trading script
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ: ${{ secrets.TOSS_ACCOUNT_SEQ }}
          FIXIE_URL: ${{ secrets.FIXIE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py